<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikotinstopp</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚭</text></svg>">
    <meta name="theme-color" content="#2c3e50">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 { color: #2c3e50; text-align: center; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #1b5e20; }
        .btn-danger {
            background-color: #c62828;
            margin-top: 15px;
        }
        .btn-danger:hover { background-color: #b71c1c; }

        /* Dashboard & Tracker Stile */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .stat-box {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 22px;
            font-weight: bold;
            color: #2e7d32;
        }
        .stat-label {
            font-size: 13px;
            color: #555;
            margin-top: 2px;
        }
        .phase-badge {
            display: inline-block;
            background: #2c3e50;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .tip-box {
            background: #e3f2fd;
            border-left: 4px solid #1976d2;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.4;
        }

        /* Craving-SOS Stile */
        .btn-sos {
            background-color: #d32f2f;
            color: white;
            font-size: 18px;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-sos:hover { background-color: #b71c1c; }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        .timer-display {
            font-size: 36px;
            font-weight: bold;
            color: #d32f2f;
            margin: 15px 0;
        }
        .btn-secondary {
            background-color: #757575;
            margin-top: 10px;
        }
        .btn-secondary:hover { background-color: #616161; }

        /* Check-in Banner Stile */
        .checkin-card {
            background: #fff8e1;
            border: 2px solid #ffa000;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .checkin-title {
            font-weight: bold;
            color: #f57c00;
            margin-bottom: 8px;
        }
        .checkin-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-success { background-color: #388e3c; }
        .btn-warning { background-color: #f57c00; }

        /* Trigger-Tagebuch Stile */
        .trigger-item {
            background: #f9f9f9;
            border-left: 4px solid #00897b;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            text-align: left;
            font-size: 14px;
        }
        .trigger-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #00695c;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <h1>Nikotinstopp</h1>

    <!-- Onboarding-Ansicht -->
    <div class="card" id="onboardingCard">
        <h2>Dein Ausstieg – Einstellungen</h2>
        <form id="onboardingForm">
            <div class="form-group">
                <label for="nikotinForm">Nikotinform:</label>
                <select id="nikotinForm" required>
                    <option value="snus">Snus</option>
                    <option value="zigaretten">Zigaretten</option>
                    <option value="sonstiges">Sonstiges</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tagesMenge">Konsum pro Tag (Portionen / Zigaretten):</label>
                <input type="number" id="tagesMenge" min="1" placeholder="z. B. 10" required>
            </div>

            <div class="form-group">
                <label for="tagesKosten">Kosten pro Tag (in CHF):</label>
                <input type="number" id="tagesKosten" step="0.10" min="0" placeholder="z. B. 8.00" required>
            </div>

            <div class="form-group">
                <label for="stichtag">Dein Stichtag:</label>
                <input type="date" id="stichtag" required>
            </div>

            <div class="form-group">
                <label for="gruende">Deine Gründe für den Ausstieg:</label>
                <textarea id="gruende" rows="3" placeholder="z. B. Gesundheit verbessern, Geld sparen..." required></textarea>
            </div>

            <button type="submit">Ausstieg starten</button>
        </form>
    </div>

    <!-- Dashboard-Ansicht -->
    <div class="card" id="dashboardCard" style="display: none;"></div>

    <!-- Craving-SOS Modal Container -->
    <div id="sosOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-content" id="sosModalContent"></div>
    </div>

    <!-- Trigger Eintragen Modal -->
    <div id="triggerOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>📝 Auslöser eintragen</h3>
            <p style="font-size: 14px;">Was hat den Drang ausgelöst?</p>
            <form id="triggerForm">
                <div class="form-group" style="text-align: left;">
                    <label for="triggerKategorie">Situation / Kategorie:</label>
                    <select id="triggerKategorie" required>
                        <option value="Stress / Ärger">Stress / Ärger</option>
                        <option value="Kaffee / Mahlzeit">Kaffee / Mahlzeit</option>
                        <option value="Geselligkeit / Alkohol">Geselligkeit / Alkohol</option>
                        <option value="Langeweile / Wartezeit">Langeweile / Wartezeit</option>
                        <option value="Gewohnheit / Ort">Gewohnheit / Ort</option>
                        <option value="Sonstiges">Sonstiges</option>
                    </select>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="triggerNotiz">Notiz (Wo / Wann / Genaues Gefühl):</label>
                    <textarea id="triggerNotiz" rows="2" placeholder="z. B. Nach dem Mittagessen in der Pause..." required></textarea>
                </div>
                <button type="submit" style="background-color: #00897b;">Auslöser speichern</button>
                <button type="button" id="btnCancelTrigger" class="btn-secondary">Abbrechen</button>
            </form>
        </div>
    </div>

    <!-- Rückfall-Modus Modal Container -->
    <div id="relapseOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-content" id="relapseModalContent"></div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker erfolgreich registriert.'))
                .catch((err) => console.error('Service Worker Fehler:', err));
        }
    </script>
</body>
</html>
