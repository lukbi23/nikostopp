<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikotinstopp</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚭</text></svg>">
    <meta name="theme-color" content="#2c3e50">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 { color: #2c3e50; text-align: center; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>
    <h1>Nikotinstopp</h1>

    <div class="card" id="onboardingCard">
        <h2>Dein Ausstieg – Einstellungen</h2>
        <form id="onboardingForm">
            <div class="form-group">
                <label for="nikotinForm">Nikotinform:</label>
                <select id="nikotinForm" required>
                    <option value="snus">Snus</option>
                    <option value="zigaretten">Zigaretten</option>
                    <option value="sonstiges">Sonstiges</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tagesMenge">Konsum pro Tag (Portionen / Zigaretten):</label>
                <input type="number" id="tagesMenge" min="1" placeholder="z. B. 10" required>
            </div>

            <div class="form-group">
                <label for="tagesKosten">Kosten pro Tag (in CHF):</label>
                <input type="number" id="tagesKosten" step="0.10" min="0" placeholder="z. B. 8.00" required>
            </div>

            <div class="form-group">
                <label for="stichtag">Dein Stichtag:</label>
                <input type="date" id="stichtag" required>
            </div>

            <div class="form-group">
                <label for="gruende">Deine Gründe für den Ausstieg:</label>
                <textarea id="gruende" rows="3" placeholder="z. B. Gesundheit verbessern, Geld sparen..." required></textarea>
            </div>

            <button type="submit">Ausstieg starten</button>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker erfolgreich registriert.'))
                .catch((err) => console.error('Service Worker Fehler:', err));
        }
    </script>
</body>
</html>
